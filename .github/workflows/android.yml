name: Android

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes de unidade (lógica pura + app)
        run: ./gradlew test --stacktrace

      - name: Compilar APK de debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Nomear APK com app, fase e versão
        id: nome
        run: |
          prop() { grep "^$1=" gradle.properties | cut -d= -f2; }
          NOME="$(prop euno.appName)-fase$(prop euno.phase)-v$(prop euno.version)-build${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${NOME}.apk"
          echo "nome=${NOME}" >> "$GITHUB_OUTPUT"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.nome.outputs.nome }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
