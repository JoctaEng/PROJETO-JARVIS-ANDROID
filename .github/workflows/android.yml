name: Android

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: NDK e CMake (IA do celular)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;29.0.13113456" "cmake;3.31.6" > /dev/null
          ls "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake"

      - name: Fonte do llama.cpp (IA do celular, ADR 0009)
        run: git clone --depth 1 --branch v0.5.0 https://github.com/ggml-org/llama.cpp mind/provider-llama/src/main/cpp/llama.cpp

      - name: sherpa-onnx (voz offline Kokoro)
        run: |
          mkdir -p app/libs
          curl -sSfL -o app/libs/sherpa-onnx-1.13.8.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  app/libs/sherpa-onnx-1.13.8.aar" | sha256sum -c -

      - name: Conferir o endereço do modelo recomendado (Qwen3-4B)
        run: |
          URL=$(grep -A1 'RECOMMENDED_URL =' app/src/main/kotlin/com/joctaeng/jarvis/poc/ModelDownload.kt | grep -o 'https://[^"]*')
          echo "URL: $URL"
          curl -sSIL --fail --max-time 60 "$URL" | grep -iE '^(HTTP|content-length|x-linked-size)' || { echo "::error::Endereço do modelo não respondeu"; exit 1; }

      - name: Chave de assinatura fixa (ADR 0010)
        env:
          EUNO_SIGNING_SEED: ${{ secrets.EUNO_SIGNING_SEED }}
        run: |
          if [ -z "$EUNO_SIGNING_SEED" ]; then
            echo "::error::Segredo EUNO_SIGNING_SEED ausente: o APK sairia com chave temporária e não atualizaria por cima do instalado. Build interrompido."
            exit 1
          fi
          python3 -m pip install --quiet --upgrade cryptography --break-system-packages || pip install --quiet cryptography || true
          SENHA=$(openssl rand -hex 24)
          echo "::add-mask::$SENHA"
          python tools/assinatura/gerar_keystore.py "$RUNNER_TEMP/euno.p12" "$SENHA"
          echo "EUNO_KEYSTORE_FILE=$RUNNER_TEMP/euno.p12" >> "$GITHUB_ENV"
          echo "EUNO_KEYSTORE_PASSWORD=$SENHA" >> "$GITHUB_ENV"

      - name: Testes de unidade (lógica pura + app)
        run: ./gradlew test --stacktrace

      - name: Compilar APK de debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Conferir assinatura do APK (atualizar por cima, sem desinstalar)
        run: |
          APKSIGNER=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          [ -n "$APKSIGNER" ] || { echo "::error::apksigner não encontrado"; exit 1; }
          ATUAL=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -m1 "certificate SHA-256 digest" | awk '{print $NF}' | tr 'a-f' 'A-F')
          ESPERADA=$(tr -d ': \n' < tools/assinatura/impressao_esperada.txt | tr 'a-f' 'A-F')
          echo "Assinatura do APK (SHA-256): $ATUAL"
          echo "Assinatura esperada:         $ESPERADA"
          [ -n "$ATUAL" ] && [ "$ATUAL" = "$ESPERADA" ] || { echo "::error::Assinatura diferente da instalada: este APK exigiria desinstalar o app. Build interrompido."; exit 1; }

      - name: Nomear APK com app, fase e versão
        id: nome
        run: |
          prop() { grep "^$1=" gradle.properties | cut -d= -f2; }
          NOME="$(prop euno.appName)-fase$(prop euno.phase)-v$(prop euno.version)-build${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${NOME}.apk"
          echo "nome=${NOME}" >> "$GITHUB_OUTPUT"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.nome.outputs.nome }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
