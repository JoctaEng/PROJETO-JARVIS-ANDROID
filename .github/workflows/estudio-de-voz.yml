name: Estúdio de Voz - APK
on:
  push:
    branches: [main, 'claude/estudio-de-voz']
    paths: ['estudio-de-voz/**', '.github/workflows/estudio-de-voz.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estudio-de-voz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci

      - run: npx cap sync android
      - name: Compilar APK (debug, assinado com chave de depuração)
        working-directory: estudio-de-voz/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Renomear
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EstudioDeVoz.apk
      - uses: actions/upload-artifact@v4
        with: { name: EstudioDeVoz-apk, path: estudio-de-voz/EstudioDeVoz.apk }
      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: estudio-de-voz-apk
          name: Estúdio de Voz (APK mais recente)
          files: estudio-de-voz/EstudioDeVoz.apk
