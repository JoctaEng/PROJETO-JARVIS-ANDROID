<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="stylesheet" href="katex.min.css">
<style>
  :root { --fg: #1d1b20; --muted: #49454f; --accent: #3d7bf0; --code: rgba(0,0,0,0.06); }
  html, body { margin: 0; padding: 0; background: transparent; color: var(--fg); }
  body { font: 15px/1.45 sans-serif; overflow-wrap: anywhere; -webkit-text-size-adjust: 100%; }
  #c > :first-child { margin-top: 0; }
  #c > :last-child { margin-bottom: 0; }
  p { margin: 0 0 0.6em; }
  h1, h2, h3, h4 { margin: 0.4em 0 0.35em; line-height: 1.25; }
  h1 { font-size: 1.25em; } h2 { font-size: 1.15em; } h3, h4 { font-size: 1.05em; }
  ul, ol { margin: 0 0 0.6em; padding-left: 1.3em; }
  li { margin: 0.15em 0; }
  a { color: var(--accent); }
  code { background: var(--code); border-radius: 4px; padding: 0 0.25em; font-size: 0.92em; }
  pre { background: var(--code); border-radius: 8px; padding: 0.6em; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  blockquote { margin: 0 0 0.6em; padding-left: 0.7em; border-left: 3px solid var(--accent); color: var(--muted); }
  table { border-collapse: collapse; margin: 0 0 0.6em; display: block; overflow-x: auto; max-width: 100%; }
  th, td { border: 1px solid var(--code); padding: 0.25em 0.5em; text-align: left; }
  th { background: var(--code); }
  .katex { font-size: 1.08em; }
  .katex-display { margin: 0.5em 0; overflow-x: auto; overflow-y: hidden; padding: 0.15em 0; }
  .math-error { color: var(--muted); font-family: monospace; }
</style>
<script src="katex.min.js"></script>
<script src="marked.umd.js"></script>
<script src="purify.min.js"></script>
<script src="render.js"></script>
</head>
<body><div id="c"></div></body>
</html>
