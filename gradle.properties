org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Quando "true", só os módulos Kotlin puros (JVM) entram no build.
# Útil em ambientes sem acesso ao Google Maven (dl.google.com).
jarvis.jvmOnly=false

# Identidade da versão — fonte única para o nome do APK, do artefato no GitHub
# e da versão exibida no app. Ao mudar de fase, atualize os três valores.
euno.appName=Euno
euno.phase=2
euno.version=0.13.3
